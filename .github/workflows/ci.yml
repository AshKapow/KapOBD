# Runs the tests on every push and pull request, then publishes GitHub Pages:
#   - main at https://<user>.github.io/<repo>/
#   - every other branch at .../preview/<branch>/ (for testing before merging)
# The site is rebuilt from scratch each time, so deleted branches disappear.
name: CI

on:
  pull_request:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Run tests
        run: node --test

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      # Every run rebuilds the whole site, so only the newest one matters.
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # all branches, for the previews
      - name: Build the site (main + branch previews)
        # Use the build script from the commit that triggered this run (like
        # the workflow itself), so a branch can change it before it's on main.
        run: |
          git show "$GITHUB_SHA:tools/build-site.sh" > "$RUNNER_TEMP/build-site.sh"
          bash "$RUNNER_TEMP/build-site.sh" _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
